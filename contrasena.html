<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PsiAgenda · Crear contrasena</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f2fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 14px 40px rgba(40,20,90,.14)}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:20px}.v{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#6c3cff,#27c7ff);color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center}
h1{margin:0;color:#6c3cff;font-size:24px}h2{margin:20px 0 8px}.small{font-size:13px;color:#666;line-height:1.45}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #ddd;font-size:15px}
button{border:none;background:#6c3cff;color:#fff;font-weight:800;cursor:pointer}.ok{background:#eaffef;color:#087a2d;padding:12px;border-radius:12px;margin-top:12px}.err{background:#ffe7e7;color:#a00000;padding:12px;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="v">V</div><div><h1>PsiAgenda</h1><div class="small">Creación segura de contraseña</div></div></div>
  <div id="waiting">
    <h2>Verificando enlace…</h2>
    <div class="small">Espera unos segundos.</div>
  </div>
  <div id="form" style="display:none">
    <h2>Crear nueva contraseña</h2>
    <div class="small">Escribe la misma contraseña dos veces.</div>
    <input id="p1" type="password" autocomplete="new-password" placeholder="Crear contraseña">
    <input id="p2" type="password" autocomplete="new-password" placeholder="Repetir contraseña">
    <button id="saveBtn">Guardar contraseña</button>
  </div>
  <div id="msg"></div>
</div>
<script>
const SUPABASE_URL='https://kpkrlloxsubacruoxqlz.supabase.co';
const SUPABASE_KEY='sb_publishable_1zDD5Pgu92My50gkOHlt7Q_Dj1pjv5f';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let recoveryReady=false;

function showMsg(t,ok=false){
  msg.innerHTML='<div class="'+(ok?'ok':'err')+'">'+t+'</div>';
}

db.auth.onAuthStateChange(async(event,session)=>{
  if(event==='PASSWORD_RECOVERY' || (event==='SIGNED_IN' && session?.user)){
    recoveryReady=true;
    waiting.style.display='none';
    form.style.display='block';
    showMsg('Correo verificado. Ahora crea tu contraseña.',true);
  }
});

(async()=>{
  const {data:{session},error}=await db.auth.getSession();
  if(error){waiting.style.display='none';showMsg(error.message);return}
  if(session?.user){
    recoveryReady=true;
    waiting.style.display='none';
    form.style.display='block';
    showMsg('Correo verificado. Ahora crea tu contraseña.',true);
  }else{
    setTimeout(()=>{
      if(!recoveryReady){
        waiting.style.display='none';
        showMsg('El enlace no es válido o expiró. Vuelve a PsiAgenda y solicita uno nuevo.');
      }
    },2500);
  }
})();

saveBtn.onclick=async()=>{
  if(!recoveryReady){showMsg('Primero debes abrir un enlace válido enviado por Supabase.');return}
  if(!p1.value || p1.value.length<8){showMsg('La contraseña debe tener al menos 8 caracteres.');return}
  if(p1.value!==p2.value){showMsg('Las dos contraseñas no coinciden.');return}
  saveBtn.disabled=true;saveBtn.textContent='Guardando…';
  try{
    const {error}=await db.auth.updateUser({password:p1.value});
    if(error) throw error;
    await db.auth.signOut();
    form.style.display='none';
    showMsg('Contraseña guardada correctamente. Ya puedes volver a PsiAgenda e iniciar sesión.',true);
  }catch(e){showMsg('No se pudo guardar la contraseña: '+e.message)}
  finally{saveBtn.disabled=false;saveBtn.textContent='Guardar contraseña'}
};
</script>
</body>
</html>
